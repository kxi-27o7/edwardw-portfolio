services:
  - type: web
    name: portfolio-model-api
    runtime: python
    plan: free
    buildCommand: git lfs pull --include="local-assets/models/bankguard/**,local-assets/models/fakeguard/**,local-assets/models/seeflood/**" && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
